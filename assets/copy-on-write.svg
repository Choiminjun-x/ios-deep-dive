<svg viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif">
  <defs>
    <marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#888780"/>
    </marker>
  </defs>

  <text x="30" y="18" font-size="12" fill="#5F5E5A">청록 = 힙 버퍼</text>

  <text x="30" y="46" font-size="14" font-weight="500" fill="#2C2C2A">1 · var c2 = c1</text>
  <text x="175" y="46" font-size="12" fill="#5F5E5A">주소만 복사, 버퍼는 하나</text>

  <rect x="30" y="60" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="46" y="85" font-size="14" font-weight="500" fill="#2C2C2A">c1 · 주소</text>

  <rect x="30" y="116" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="46" y="141" font-size="14" font-weight="500" fill="#2C2C2A">c2 · 주소</text>

  <path d="M180,80 L253,100" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#b)"/>
  <path d="M180,136 L253,116" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#b)"/>

  <rect x="260" y="88" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="276" y="113" font-size="14" font-weight="500" fill="#04342C">[1, 2, 3]</text>

  <text x="440" y="103" font-size="12" fill="#5F5E5A">읽기만 하면 여기서 끝</text>

  <line x1="30" y1="180" x2="650" y2="180" stroke="#5F5E5A" stroke-width="0.5"/>

  <text x="30" y="212" font-size="14" font-weight="500" fill="#2C2C2A">2 · c2.items.append(4)</text>
  <text x="215" y="212" font-size="12" fill="#5F5E5A">쓰는 순간 버퍼를 복사</text>

  <rect x="30" y="226" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="46" y="251" font-size="14" font-weight="500" fill="#2C2C2A">c1 · 주소</text>

  <rect x="30" y="282" width="150" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="46" y="307" font-size="14" font-weight="500" fill="#2C2C2A">c2 · 주소</text>

  <path d="M180,246 L253,246" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#b)"/>
  <path d="M180,302 L253,302" stroke="#888780" stroke-width="1" fill="none" marker-end="url(#b)"/>

  <rect x="260" y="226" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="276" y="251" font-size="14" font-weight="500" fill="#04342C">[1, 2, 3]</text>

  <rect x="260" y="282" width="160" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="276" y="307" font-size="14" font-weight="500" fill="#04342C">[1, 2, 3, 4]</text>
  <text x="440" y="307" font-size="12" fill="#5F5E5A">새로 만든 버퍼</text>
</svg>
