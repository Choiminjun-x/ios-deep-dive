<svg viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888780"/>
    </marker>
  </defs>

  <!-- legend -->
  <rect x="30" y="12" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="46" y="21" font-size="12" fill="#5F5E5A">기존 유닉스 경로</text>
  <rect x="170" y="12" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="186" y="21" font-size="12" fill="#0F6E56">샌드박스 계층</text>

  <!-- 1. 앱 코드 -->
  <rect x="60" y="50" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="76" y="70" font-size="14" font-weight="500" fill="#2C2C2A">앱 코드</text>
  <text x="76" y="86" font-size="12" fill="#5F5E5A">FileManager.contentsOfFile()</text>
  <line x1="210" y1="96" x2="210" y2="118" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 2. 시스템 콜 -->
  <rect x="60" y="126" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="76" y="146" font-size="14" font-weight="500" fill="#2C2C2A">시스템 콜 open()</text>
  <text x="76" y="162" font-size="12" fill="#5F5E5A">libSystem, 우회 불가</text>
  <line x1="210" y1="172" x2="210" y2="208" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- boundary -->
  <line x1="30" y1="192" x2="650" y2="192" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 4"/>
  <text x="390" y="188" font-size="12" fill="#5F5E5A">사용자 공간 / 커널 공간</text>

  <!-- 3. DAC -->
  <rect x="60" y="216" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="76" y="236" font-size="14" font-weight="500" fill="#2C2C2A">DAC 검사</text>
  <text x="76" y="252" font-size="12" fill="#5F5E5A">소유자·그룹 권한</text>
  <text x="390" y="243" font-size="12" fill="#5F5E5A">mobile 소유 → 통과</text>
  <line x1="210" y1="262" x2="210" y2="294" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 4. MAC -->
  <rect x="60" y="302" width="300" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="322" font-size="14" font-weight="500" fill="#04342C">MAC 검사</text>
  <text x="76" y="338" font-size="12" fill="#0F6E56">TrustedBSD 훅</text>
  <text x="390" y="329" font-size="12" fill="#5F5E5A">앱이 완화할 수 없음</text>
  <line x1="210" y1="348" x2="210" y2="370" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 5. profile -->
  <rect x="60" y="378" width="300" height="46" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="76" y="398" font-size="14" font-weight="500" fill="#04342C">샌드박스 프로파일 평가</text>
  <text x="76" y="414" font-size="12" fill="#0F6E56">entitlements에서 결정</text>
  <text x="390" y="405" font-size="12" fill="#5F5E5A">컨테이너 밖 → 거부</text>
  <line x1="210" y1="424" x2="210" y2="446" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow)"/>

  <!-- 6. result -->
  <rect x="60" y="454" width="300" height="46" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="76" y="474" font-size="14" font-weight="500" fill="#2C2C2A">EPERM 반환</text>
  <text x="76" y="490" font-size="12" fill="#5F5E5A">두 관문 모두 통과해야 허용</text>
</svg>
